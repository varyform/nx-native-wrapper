# Optional: everything also works with the Homebrew tools (Brewfile). With mise, `mise run setup` and friends.
[tools]
xcodegen = "2.46.0"
uv = "0.11.10"

[tasks.setup]
description = "Check the Mac, install the tools and Python packages, clone nxnative, build and install NX Play"
run = "bin/setup"

[tasks.doctor]
description = "Report what the setup is missing, without changing anything"
run = "bin/setup --check"

[tasks.generate]
description = "Generate NXPlay.xcodeproj from project.yml"
run = "xcodegen generate"

[tasks.test]
description = "Run the NXPlayKit tests"
run = "swift test --package-path Packages/NXPlayKit"

[tasks.stats]
description = "Lines of code, types and functions per part of the repo, as rails stats"
run = "bin/stats"

[tasks.build]
description = "Build NX Play.app (Release) into build/"
run = "bin/build"

[tasks.install]
description = "Build NX Play.app and install it into /Applications"
run = "bin/install"

[tasks.screenshots]
description = "Regenerate the README screenshots in docs/ (bin/screenshots [games folder])"
run = "bin/screenshots"

[tasks.app]
description = "Build and open NX Play"
depends = ["build"]
run = "open 'build/Build/Products/Release/NX Play.app'"
