name: NXPlay
options:
  bundleIdPrefix: com.varyform
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.7.8"
    CURRENT_PROJECT_VERSION: "10"

packages:
  NXPlayKit:
    path: Packages/NXPlayKit

targets:
  NXPlay:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - AppIcon.icon
      # Icon Composer document: Xcode compiles it into the asset catalog as AppIcon
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: nxplay
        buildPhase: resources
      # Help › NX Play Changelog, and an update's What's New (read from the downloaded app's copy)
      - path: CHANGELOG.md
        buildPhase: resources
    postCompileScripts:
      # the setup NX Play runs from Settings › Setup: bin/setup with the files it reads (AppHome.setupProject)
      - name: Bundle the setup
        script: |
          dir="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/Setup"
          mkdir -p "$dir"
          cp "$SRCROOT/bin/setup" "$dir/setup"
          cp "$SRCROOT/bin/askpass" "$dir/askpass"
          cp "$SRCROOT/Brewfile" "$SRCROOT/pyproject.toml" "$SRCROOT/uv.lock" "$SRCROOT/.python-version" "$dir/"
        inputFiles:
          - $(SRCROOT)/bin/setup
          - $(SRCROOT)/bin/askpass
          - $(SRCROOT)/Brewfile
          - $(SRCROOT)/pyproject.toml
          - $(SRCROOT)/uv.lock
          - $(SRCROOT)/.python-version
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/setup
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/askpass
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/Brewfile
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/pyproject.toml
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/uv.lock
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Setup/.python-version
    dependencies:
      - package: NXPlayKit
    settings:
      base:
        PRODUCT_NAME: NX Play
        PRODUCT_BUNDLE_IDENTIFIER: com.varyform.nxplay
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: App/Info.plist
        # Info.plist's NXSourceRoot (AppHome.sourceRoot); bin/release empties it
        NX_SOURCE_ROOT: $(SRCROOT)
        INFOPLIST_KEY_CFBundleDisplayName: NX Play
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Oleh Khomei. MIT License."
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # runs nxplay, python, git and the game from the user's folders: no sandbox
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme:
      testTargets: []
